<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="690" fill="#f8fafc"/>
  <text x="600" y="44" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#0f172a">Five-Color Robot Sorting Architecture</text>
  <text x="600" y="73" text-anchor="middle" font-family="Arial" font-size="15" fill="#475569">C++17, OpenCV, ROS 2 Jazzy, ros2_control, and Gazebo Harmonic</text>

  <g font-family="Arial" text-anchor="middle">
    <rect x="45" y="125" width="190" height="100" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="140" y="165" font-size="18" font-weight="700" fill="#1e3a8a">RGB Camera</text>
    <text x="140" y="193" font-size="14" fill="#334155">Two-table top view</text>

    <rect x="285" y="125" width="210" height="100" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="390" y="158" font-size="18" font-weight="700" fill="#4c1d95">OpenCV Vision</text>
    <text x="390" y="184" font-size="14" fill="#334155">HSV, morphology, contour</text>
    <text x="390" y="207" font-size="14" fill="#334155">centroid + debug image</text>

    <rect x="545" y="125" width="210" height="100" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="650" y="158" font-size="18" font-weight="700" fill="#78350f">Color Command</text>
    <text x="650" y="184" font-size="14" fill="#334155">white, red, blue,</text>
    <text x="650" y="207" font-size="14" fill="#334155">yellow, or green</text>

    <rect x="805" y="125" width="210" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="910" y="158" font-size="18" font-weight="700" fill="#14532d">Target Selection</text>
    <text x="910" y="184" font-size="14" fill="#334155">Visual confirmation</text>
    <text x="910" y="207" font-size="14" fill="#334155">+ source/destination slots</text>

    <rect x="805" y="330" width="210" height="100" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="910" y="363" font-size="18" font-weight="700" fill="#0c4a6e">Coordinator</text>
    <text x="910" y="389" font-size="14" fill="#334155">Color-specific pick + place</text>
    <text x="910" y="412" font-size="14" fill="#334155">arm and gripper actions</text>

    <rect x="545" y="330" width="210" height="100" rx="14" fill="#fae8ff" stroke="#c026d3" stroke-width="2"/>
    <text x="650" y="363" font-size="18" font-weight="700" fill="#701a75">Robot Control</text>
    <text x="650" y="389" font-size="14" fill="#334155">separate ros2_control</text>
    <text x="650" y="412" font-size="14" fill="#334155">arm + gripper controllers</text>

    <rect x="285" y="330" width="210" height="100" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="390" y="363" font-size="18" font-weight="700" fill="#7c2d12">Gazebo Physics</text>
    <text x="390" y="389" font-size="14" fill="#334155">contact, friction, gravity</text>
    <text x="390" y="412" font-size="14" fill="#334155">dynamic object poses</text>

    <rect x="45" y="330" width="190" height="100" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <text x="140" y="363" font-size="18" font-weight="700" fill="#134e4a">Verification</text>
    <text x="140" y="389" font-size="14" fill="#334155">lift, displacement, goal</text>
    <text x="140" y="412" font-size="14" fill="#334155">height + explicit pass/fail</text>
  </g>

  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M235 175 H275"/>
    <path d="M495 175 H535"/>
    <path d="M755 175 H795"/>
    <path d="M910 225 V320"/>
    <path d="M805 380 H765"/>
    <path d="M545 380 H505"/>
    <path d="M285 380 H245"/>
  </g>

  <rect x="120" y="500" width="960" height="145" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="535" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a">Reusable C++ robotics foundation</text>
  <text x="600" y="570" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">DH forward kinematics · analytical Jacobian · damped least-squares IK · quintic trajectories</text>
  <text x="600" y="600" text-anchor="middle" font-family="Arial" font-size="15" fill="#334155">joint-limit enforcement · automated numerical tests · CSV metrics · native SVG visualization</text>
  <text x="600" y="628" text-anchor="middle" font-family="Arial" font-size="14" fill="#64748b">Perception and manipulation remain inspectable; no hidden object attachment is used.</text>
</svg>
